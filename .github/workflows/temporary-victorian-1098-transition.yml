name: Temporary Victorian 1098 transition verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: [.github/workflows/temporary-victorian-1098-transition.yml]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-event-scope-and-delivery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate revision and reconcile newly added event metadata
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/check-efficient.cjs syntax
          node tools/generate-event-catalog.cjs --check
          node --input-type=commonjs -e "const fs=require('node:fs');console.log('GENERATED_VERSION='+fs.readFileSync('js/version.js','utf8').match(/[a-f0-9]{64}/)[0])"
      - name: Validate historically bounded Victorian employment and followups
        run: node tools/check-efficient.cjs run v88_regional_career_outcomes.test.cjs v88_outcome_followup_lineage.test.cjs v88_historical_catalog_schema_and_sources.test.cjs
      - name: Commit current generated artifacts after passing checks
        run: |
          git add js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize 1098 Victorian postwar event revision and catalog"
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
