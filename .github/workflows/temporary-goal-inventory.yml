name: Temporary goal and affiliation contract inventory
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths:
      - '.github/workflows/temporary-goal-inventory.yml'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/v88_goal_contract_inventory.test.cjs
