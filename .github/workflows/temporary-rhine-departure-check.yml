name: Temporary Higashi and civilian career goal verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-rhine-departure-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scoped gameplay contracts
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_rhine_and_rhodes_departure_lifecycle.test.cjs
          node tools/check-efficient.cjs run v88_higashi_and_siracusa_retirement_goals.test.cjs
          node tools/check-efficient.cjs run v88_workplace_goal_departure_contracts.test.cjs
          node tools/check-efficient.cjs run v88_affiliation_goal_closure.test.cjs
          node tools/check-efficient.cjs run v88_affiliation_goal_outcome_branches.test.cjs
      - name: Sync catalog and version
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync modified event catalog and engine revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
