name: Temporary regional promotion history verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: [.github/workflows/temporary-regional-promotion-history.yml]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-event-scope-and-delivery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate current runtime and catalog
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --write
          node tools/check-efficient.cjs syntax
          node tools/generate-event-catalog.cjs --check
          node --input-type=commonjs -e "const fs=require('node:fs');console.log('GENERATED_VERSION='+fs.readFileSync('js/version.js','utf8').match(/[a-f0-9]{64}/)[0])"
      - name: Validate registered promotions and regional career history
        run: node tools/check-efficient.cjs run v88_regional_promotion_history.test.cjs v88_regional_career_outcomes.test.cjs v88_affiliation_goal_outcome_branches.test.cjs
      - name: Record reviewed generated artifacts
        run: |
          git add js/version.js EVENT_CATALOG.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize regional promotion engine revision and event catalog"
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
