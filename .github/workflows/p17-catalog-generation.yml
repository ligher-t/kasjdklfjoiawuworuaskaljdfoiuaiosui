name: P17 one-time education catalog synchronization
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths:
      - .github/workflows/p17-catalog-generation.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The terminal data phase injects P17 scenes before metadata reconciliation.
      - name: Regenerate runtime revision and validated event review catalog
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
      - name: Commit generated runtime metadata to this draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(education): reconcile P17 reviewed event catalog and engine revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
