name: Refresh U15 housing revision and verify selected boundaries (temporary)
on:
  push:
    branches: ['fix/historical-event-scope-and-delivery']
    paths:
      - '.github/workflows/sync-u15-housing.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh catalog and runtime fingerprint
        run: |
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
      - name: Run selected cohabitation and relationship tests
        run: |
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_cohabitation_residence_accounting.test.cjs
          node tools/check-efficient.cjs run v88_relationship_flag_lifecycle.test.cjs
      - name: Commit runtime fingerprint
        run: |
          git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' add js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'Update runtime revision after cohabitation accounting fix'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
