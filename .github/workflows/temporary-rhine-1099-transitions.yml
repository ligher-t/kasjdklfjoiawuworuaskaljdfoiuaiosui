name: Temporary Rhine 1099 transition verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: [.github/workflows/temporary-rhine-1099-transitions.yml]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-event-scope-and-delivery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile new Rhine review events and check syntax
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/check-efficient.cjs syntax
          node tools/generate-event-catalog.cjs --check
      - name: Verify Rhine Lab 1099 events and 1100 career transitions
        run: node tools/check-efficient.cjs run v88_rhine_and_rhodes_departure_lifecycle.test.cjs v88_cross_faction_affiliation_transitions.test.cjs
      - name: Commit generated catalog after passing tests
        run: |
          git add js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: synchronize Rhine Lab career transition catalog"
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
