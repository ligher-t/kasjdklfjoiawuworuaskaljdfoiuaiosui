name: Verify Katorga detention contract (temporary)
on:
  push:
    branches: ['fix/historical-event-scope-and-delivery']
    paths:
      - '.github/workflows/sync-katorga-custody.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync event catalogue and runtime revision
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
      - name: Katorga actual event and custody test
        run: |
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_ursus_katorga_custody_lifecycle.test.cjs
      - name: Commit only generated files
        run: |
          git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'Synchronize catalogue and runtime fingerprint for Katorga custody'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
