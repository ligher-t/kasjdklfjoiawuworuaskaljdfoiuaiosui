name: Temporary event priority and crisis metadata sync
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-priority-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate catalog and check real event dispatch
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_crisis_event_priority.test.cjs
          node tools/check-efficient.cjs run v88_timeline_local_events.test.cjs
          node tools/check-efficient.cjs run v88_history_scope_and_pending.test.cjs
          node tools/check-efficient.cjs run audit-diagnostics.test.cjs
      - name: Commit generated revision and catalog
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync event priority metadata and runtime revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
