name: I07 catalog synchronization
on:
  push:
    branches:
      - fix/historical-event-scope-and-delivery
    paths:
      - .github/workflows/i07-catalog-sync.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-event-scope-and-delivery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate canonical catalog and runtime revision
        run: |
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --check
          node tools/check-efficient.cjs syntax
      - name: Commit generated catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/event-catalog-metadata.json EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(education): sync P17 generated event catalog"
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
