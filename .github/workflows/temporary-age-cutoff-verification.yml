name: Temporary age and year cutoff verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-age-cutoff-verification.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify age bound and outcome deadline ordering
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_age_cutoff_competing_followups.test.cjs
          node tools/check-efficient.cjs run v88_expiring_followup_priority.test.cjs
          node tools/check-efficient.cjs run v88_crisis_event_priority.test.cjs
          node tools/check-efficient.cjs run v88_outcome_followup_lineage.test.cjs
          node tools/check-efficient.cjs run audit-diagnostics.test.cjs
      - name: Synchronize generated metadata
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync age cutoff choice priority and runtime metadata'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
