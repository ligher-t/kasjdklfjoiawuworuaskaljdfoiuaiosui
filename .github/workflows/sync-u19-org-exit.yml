name: Verify organization closure and overdue letters (temporary)
on:
  push:
    branches: ['fix/historical-event-scope-and-delivery']
    paths:
      - '.github/workflows/sync-u19-org-exit.yml'
permissions:
  contents: write
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize generated catalogue and engine revision
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
      - name: Check real affiliation, goal and organization transitions
        run: |
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_infected_organization_exit_consistency.test.cjs
      - name: Persist generated files
        run: |
          git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'Synchronize catalogue for infected organization exit'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
