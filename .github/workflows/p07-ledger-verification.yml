name: P07 finance, boarding and annual reconciliation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-ledger-verification.yml'
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical engine revision
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
      - name: P07 ledger
        run: node tools/check-efficient.cjs run p18-education-finance-ledger.test.cjs
      - name: P06 case integration
        run: node tools/check-efficient.cjs run p18-education-case-fsm.test.cjs
      - name: Existing education annual/loan regression
        run: node tools/check-efficient.cjs run v87_education_path.js
      - name: Syntax integrity
        run: node tools/check-efficient.cjs syntax
      - name: Commit generated runtime revision
        run: |
          if ! git diff --quiet -- js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json
            git commit -m "chore(education): regenerate P07 engine revision"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
