name: U19 Active Relationship Flags targeted verification (temporary)
on:
  push:
    branches: ['fix/historical-event-scope-and-delivery']
    paths:
      - '.github/workflows/sync-u19-active-flags.yml'
permissions:
  contents: write
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate event catalogue and runtime revision
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
      - name: Focused relationship active-flags and prior romance tests
        run: |
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_relationship_flag_lifecycle.test.cjs
          node tools/check-efficient.cjs run v88_romance_lifecycle_coherence.test.cjs
          node tools/check-efficient.cjs run v88_outcome_followup_lineage.test.cjs
      - name: Persist generated outputs
        run: |
          git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'Synchronize runtime revision after active-relationship flag reconciliation'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
