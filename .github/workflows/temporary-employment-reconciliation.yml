name: Temporary employment reconciliation verification
on:
  push:
    branches:
      - fix/historical-event-scope-and-delivery
    paths:
      - .github/workflows/temporary-employment-reconciliation.yml
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate revision locally without writing to branch
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --check
          node tools/check-efficient.cjs syntax
          node --input-type=commonjs -e "const fs=require('node:fs');console.log('GENERATED_VERSION='+fs.readFileSync('js/version.js','utf8').match(/[a-f0-9]{64}/)[0])"
      - name: Employment-specific regression
        run: node tools/check-efficient.cjs run v88_workplace_goal_departure_contracts.test.cjs
