name: Refresh player-text catalog and focused regression (temporary)
on:
  push:
    branches: ['fix/historical-event-scope-and-delivery']
    paths:
      - '.github/workflows/sync-player-text-catalog.yml'
      - 'tests/v88_regional_career_outcomes.test.cjs'
      - 'data/parts/routes/regional-careers/**'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate event catalogue
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
      - name: Check regional careers and output-only result
        run: |
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_regional_career_outcomes.test.cjs
      - name: Save generated catalogue and revision
        run: |
          git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'Regenerate event catalogue and runtime revision for reviewed text'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
