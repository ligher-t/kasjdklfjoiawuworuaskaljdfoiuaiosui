name: Temporary cross-career consequences audit
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: [.github/workflows/temporary-cross-career-audit.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-event-scope-and-delivery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-check all event outcomes that terminate current occupation
        run: |
          node <<'NODE'
          const vm=require('node:vm'),{context}=require('./tests/support/annual-cases.cjs');
          const {ctx}=context(process.cwd());
          const scan=JSON.parse(vm.runInContext(`JSON.stringify((()=>{
            const issues=[],stats={events:EV.length,outcomes:0,jobExit:0,missingAffiliation:0,missingGoal:0,otherJob:0,groupLeave:0};
            for(const event of EV){
              for(let ci=0;ci<(event.c||[]).length;ci++){
                const c=event.c[ci];
                for(let oi=0;oi<(c.o||[]).length;oi++){
                  const out=c.o[oi],fx=out?.[2];stats.outcomes++;
                  if(!fx||typeof fx!=='object')continue;
                  const aff=[fx.lifeAffiliation,...(fx.lifeAffiliations||[])].filter(Boolean),
                    goals=[fx.lifeGoal,...(fx.lifeGoals||[])].filter(Boolean);
                  if(fx.job===0){
                    stats.jobExit++;
                    const missingAff=!aff.some(a=>['leave','suspend'].includes(a.action)),
                      missingGoal=!goals.some(g=>['abandon','complete','pause','compromise'].includes(g.action));
                    if(missingAff)stats.missingAffiliation++;
                    if(missingGoal)stats.missingGoal++;
                    issues.push({id:event.id,ci,oi,from:event.t?.slice(0,56),result:String(out[1]).slice(0,90),
                      hasAff:!missingAff,hasGoal:!missingGoal,keys:Object.keys(fx).slice(0,15)});
                  }
                  if(typeof fx.job==='number' && fx.job>0 && !aff.some(a=>['join','return','assign'].includes(a.action))){
                    stats.otherJob++;
                    issues.push({id:event.id,ci,oi,newJob:fx.job,hasAff:false,result:String(out[1]).slice(0,90)});
                  }
                  if(aff.some(a=>a.action==='leave')&&!goals.some(g=>['abandon','pause','complete','compromise'].includes(g.action)))stats.groupLeave++;
                }
              }
            }
            return{stats,issues};
          })())`,ctx));
          console.log('CROSS_CAREER_AUDIT '+JSON.stringify(scan));
          NODE
