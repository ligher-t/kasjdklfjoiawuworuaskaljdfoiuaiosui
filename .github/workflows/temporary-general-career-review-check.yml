name: Temporary rejected-hire and short-contract lifecycle verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-general-career-review-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile editorial metadata and check actual career cases
        run: |
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_rejected_career_and_short_contract_goals.test.cjs
          node tools/check-efficient.cjs run v87_sargon_contract_lifecourse.js
          node tools/check-efficient.cjs run v88_workplace_goal_departure_contracts.test.cjs
          node tools/check-efficient.cjs run v88_affiliation_goal_closure.test.cjs
      - name: Synchronize editorial metadata, catalog and version
        run: |
          git add tools/event-catalog-metadata.json EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: synchronize general-career follow-up metadata and catalog'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
