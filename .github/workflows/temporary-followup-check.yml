name: Temporary final-year followup verification
# Recheck full initialized romance outcome state.
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-followup-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate final-year followup priorities and catalog
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_expiring_followup_priority.test.cjs
          node tools/check-efficient.cjs run v88_crisis_event_priority.test.cjs
          node tools/check-efficient.cjs run v88_outcome_followup_lineage.test.cjs
          node tools/check-efficient.cjs run v88_followup_elapsed_from_status.test.cjs
          node tools/check-efficient.cjs run audit-diagnostics.test.cjs
      - name: Synchronize generated catalog and version
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync final-year followup revision and event catalog'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
