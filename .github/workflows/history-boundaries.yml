name: History direct-experience boundaries (targeted)
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'data/world/history.js'
      - 'tools/**'
      - 'tests/v88_history_scope_and_pending.test.cjs'
      - 'tests/v88_regional_career_outcomes.test.cjs'
      - 'tests/v88_death_job_and_year_basis.test.cjs'
      - '.github/workflows/history-boundaries.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'data/world/history.js'
      - 'tools/**'
      - 'tests/v88_history_scope_and_pending.test.cjs'
      - 'tests/v88_regional_career_outcomes.test.cjs'
      - 'tests/v88_death_job_and_year_basis.test.cjs'
      - '.github/workflows/history-boundaries.yml'
permissions:
  contents: read
jobs:
  history-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Targeted death regression and revision diagnostic (temporary)
        run: |
          node tools/check-efficient.cjs run v88_death_job_and_year_basis.test.cjs
          node tools/check-efficient.cjs run v87_war_mortality_scope.js
          node -e "console.log('EXPECTED_REVISION=' + require('./tools/update-version.cjs').revision())"
      - name: Runtime syntax and revision
        run: node tools/check-efficient.cjs syntax
      - name: Historically situated information
        run: node tools/check-efficient.cjs run v88_history_scope_and_pending.test.cjs
      - name: Regional recruitment, custody and career outcome
        run: node tools/check-efficient.cjs run v88_regional_career_outcomes.test.cjs
      - name: Death risks and annual-accounting boundaries
        run: node tools/check-efficient.cjs run v88_death_job_and_year_basis.test.cjs
