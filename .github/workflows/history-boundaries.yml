name: History direct-experience boundaries (targeted)
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'data/world/history.js'
      - 'tools/**'
      - 'tests/v88_history_scope_and_pending.test.cjs'
      - 'tests/v88_regional_career_outcomes.test.cjs'
      - 'tests/v88_death_job_and_year_basis.test.cjs'
      - 'tests/v88_language_school_scopes.test.cjs'
      - 'tests/v88_effect_subject_finance_and_infection.test.cjs'
      - 'tests/v88_outcome_followup_lineage.test.cjs'
      - 'tests/v88_relationship_flag_lifecycle.test.cjs'
      - 'tests/v88_cohabitation_residence_accounting.test.cjs'
      - 'tests/v88_ursus_katorga_custody_lifecycle.test.cjs'
      - 'tests/v88_followup_elapsed_from_status.test.cjs'
      - 'tests/v88_infected_organization_exit_consistency.test.cjs'
      - 'tests/v88_affiliation_goal_closure.test.cjs'
      - 'tests/v88_affiliation_legacy_event_boundaries.test.cjs'
      - 'tests/v88_romance_lifecycle_coherence.test.cjs'
      - '.github/workflows/history-boundaries.yml'
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'data/world/history.js'
      - 'tools/**'
      - 'tests/v88_history_scope_and_pending.test.cjs'
      - 'tests/v88_regional_career_outcomes.test.cjs'
      - 'tests/v88_death_job_and_year_basis.test.cjs'
      - 'tests/v88_language_school_scopes.test.cjs'
      - 'tests/v88_effect_subject_finance_and_infection.test.cjs'
      - 'tests/v88_outcome_followup_lineage.test.cjs'
      - 'tests/v88_relationship_flag_lifecycle.test.cjs'
      - 'tests/v88_cohabitation_residence_accounting.test.cjs'
      - 'tests/v88_ursus_katorga_custody_lifecycle.test.cjs'
      - 'tests/v88_followup_elapsed_from_status.test.cjs'
      - 'tests/v88_infected_organization_exit_consistency.test.cjs'
      - 'tests/v88_affiliation_goal_closure.test.cjs'
      - 'tests/v88_affiliation_legacy_event_boundaries.test.cjs'
      - 'tests/v88_romance_lifecycle_coherence.test.cjs'
      - '.github/workflows/history-boundaries.yml'
permissions:
  contents: read
jobs:
  history-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax and revision
        run: node tools/check-efficient.cjs syntax
      - name: Historically situated information
        run: node tools/check-efficient.cjs run v88_history_scope_and_pending.test.cjs
      - name: Regional recruitment, custody and career outcome
        run: node tools/check-efficient.cjs run v88_regional_career_outcomes.test.cjs
      - name: Death risks and annual-accounting boundaries
        run: node tools/check-efficient.cjs run v88_death_job_and_year_basis.test.cjs
      - name: Interpreter and school-knowledge boundaries
        run: node tools/check-efficient.cjs run v88_language_school_scopes.test.cjs
      - name: Effect subject and transfer boundaries
        run: node tools/check-efficient.cjs run v88_effect_subject_finance_and_infection.test.cjs
      - name: Event outcome lineage and actor location
        run: node tools/check-efficient.cjs run v88_outcome_followup_lineage.test.cjs
      - name: Relationship active-flag lifecycle
        run: |
          node tools/check-efficient.cjs run v88_relationship_flag_lifecycle.test.cjs
          node tools/check-efficient.cjs run v88_romance_lifecycle_coherence.test.cjs
      - name: Unmarried cohabitation, breakup and balance-sheet boundaries
        run: node tools/check-efficient.cjs run v88_cohabitation_residence_accounting.test.cjs
      - name: Katorga special custody and release lifecycle
        run: node tools/check-efficient.cjs run v88_ursus_katorga_custody_lifecycle.test.cjs
      - name: Delayed followup after actual withdrawal
        run: node tools/check-efficient.cjs run v88_followup_elapsed_from_status.test.cjs
      - name: Organization exit, successor and long-term goal coherence
        run: node tools/check-efficient.cjs run v88_infected_organization_exit_consistency.test.cjs
      - name: Civic and research duties close linked life goals
        run: node tools/check-efficient.cjs run v88_affiliation_goal_closure.test.cjs
      - name: Affiliation legacy and actual departure boundaries
        run: node tools/check-efficient.cjs run v88_affiliation_legacy_event_boundaries.test.cjs
