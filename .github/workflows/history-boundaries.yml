permissions:
  contents: read
jobs:
  history-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runtime syntax and revision
        run: node tools/check-efficient.cjs syntax
      - name: Historically situated information
        run: node tools/check-efficient.cjs run v88_history_scope_and_pending.test.cjs
      - name: Regional recruitment, custody and career outcome
        run: node tools/check-efficient.cjs run v88_regional_career_outcomes.test.cjs
      - name: Yan court recruitment is only offered in spring
        run: node tools/check-efficient.cjs run v88_yan_court_spring_eligibility.test.cjs
      - name: Seasonal choices honor actual calendar months
        run: node tools/check-efficient.cjs run v88_regional_choice_seasonal_calendar.test.cjs
      - name: Regional daily event seasonal eligibility
        run: node tools/check-efficient.cjs run v88_regional_daily_seasonal_calendar.test.cjs
      - name: Death risks and annual-accounting boundaries
        run: node tools/check-efficient.cjs run v88_death_job_and_year_basis.test.cjs
      - name: Interpreter and school-knowledge boundaries
        run: node tools/check-efficient.cjs run v88_language_school_scopes.test.cjs
      - name: Effect subject and transfer boundaries
        run: node tools/check-efficient.cjs run v88_effect_subject_finance_and_infection.test.cjs
      - name: Event outcome lineage and actor location
        run: node tools/check-efficient.cjs run v88_outcome_followup_lineage.test.cjs
      - name: Relationship active-flag lifecycle
        run: |
          node tools/check-efficient.cjs run v88_relationship_flag_lifecycle.test.cjs
          node tools/check-efficient.cjs run v88_romance_lifecycle_coherence.test.cjs
      - name: Unmarried cohabitation, breakup and balance-sheet boundaries
        run: node tools/check-efficient.cjs run v88_cohabitation_residence_accounting.test.cjs
      - name: Spouse co-residence daily life and actual family roster transitions
        run: node tools/check-efficient.cjs run v88_family_spouse_co_residence_events_and_roster.test.cjs
      - name: Historical timeline metadata, references and effect types
        run: node tools/check-efficient.cjs run v88_historical_catalog_schema_and_sources.test.cjs
      - name: Due medical reviews and crisis leisure classification
        run: node tools/check-efficient.cjs run v88_crisis_event_priority.test.cjs
      - name: Regional leisure versus emergency duty during volcano and civil war
        run: node tools/check-efficient.cjs run v88_regional_crisis_leisure_scope.test.cjs
      - name: Expiring romance and affiliation followup windows
        run: node tools/check-efficient.cjs run v88_expiring_followup_priority.test.cjs
      - name: Age-limited and simultaneous final-year choices
        run: node tools/check-efficient.cjs run v88_age_cutoff_competing_followups.test.cjs
      - name: Annual scheduling collision and expiring choice capacity
        run: node tools/check-efficient.cjs run v88_annual_deadline_capacity.test.cjs
      - name: Katorga special custody and release lifecycle
        run: node tools/check-efficient.cjs run v88_ursus_katorga_custody_lifecycle.test.cjs
      - name: Delayed followup after actual withdrawal
        run: node tools/check-efficient.cjs run v88_followup_elapsed_from_status.test.cjs
      - name: Organization exit, successor and long-term goal coherence
        run: node tools/check-efficient.cjs run v88_infected_organization_exit_consistency.test.cjs
      - name: Suspended mutual aid reentry uses most recent actual pause
        run: node tools/check-efficient.cjs run v88_infected_org_reentry_suspension_age.test.cjs
      - name: Kazdel displaced parent child question matches family context
        run: node tools/check-efficient.cjs run v88_kazdel_child_family_memory_context.test.cjs
      - name: Adult child contact targeting and family budget transfer boundaries
        run: node tools/check-efficient.cjs run v88_adult_child_contact_target_and_funds.test.cjs
      - name: Sibling future consultations, fixed gifts, bereavement and memories
        run: node tools/check-efficient.cjs run v88_family_child_future_and_memories.test.cjs
      - name: Civic and research duties close linked life goals
        run: node tools/check-efficient.cjs run v88_affiliation_goal_closure.test.cjs
      - name: Affiliation legacy and actual departure boundaries
        run: node tools/check-efficient.cjs run v88_affiliation_legacy_event_boundaries.test.cjs
      - name: Reunion crisis pause and old unit transfer goals
        run: node tools/check-efficient.cjs run v88_reunion_goal_transition.test.cjs
      - name: Rhodes and Reunion actual affiliations and recruitment
        run: node tools/check-efficient.cjs run v88_cross_faction_affiliation_transitions.test.cjs
      - name: Student assembly and Familia current-status debt boundaries
        run: node tools/check-efficient.cjs run v88_student_familia_status_debt.test.cjs
      - name: Individual child infection diagnoses in multi-child households
        run: node tools/check-efficient.cjs run v88_multi_child_diagnosis_target.test.cjs
      - name: Separate sibling exposure targets and past exposures
        run: node tools/check-efficient.cjs run v88_sibling_exposure_individual_targets.test.cjs
      - name: Spouse treatment reserves and sibling assistance ledgers
        run: node tools/check-efficient.cjs run v88_spouse_sibling_medical_funds.test.cjs
      - name: Annual spouse medical and sibling remittance reconciliation
        run: node tools/check-efficient.cjs run v88_separate_spouse_sibling_annual_reconciliation.test.cjs
      - name: Spouse debt aid and repeat annual recipient receipts
        run: node tools/check-efficient.cjs run v88_spouse_oneoff_and_annual_receipt_idempotency.test.cjs
      - name: Multiple child medical, study and annual family remittance reconciliation
        run: node tools/check-efficient.cjs run v88_multi_child_annual_family_budget_reconciliation.test.cjs
      - name: Divorce child support recipient and former spouse receipts
        run: node tools/check-efficient.cjs run v88_divorce_child_support_recipient_receipts.test.cjs
      - name: Multi-child medical cost quote and payer checks
        run: node tools/check-efficient.cjs run v88_multi_child_medical_quote_and_payer.test.cjs
