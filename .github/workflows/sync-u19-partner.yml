name: Synchronize U-19 partner lineage (temporary)
on:
  push:
    branches: ['fix/historical-event-scope-and-delivery']
    paths:
      - '.github/workflows/sync-u19-partner.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh generated catalog and runtime fingerprint
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
      - name: Targeted partner and selected-outcome regression
        run: |
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_outcome_followup_lineage.test.cjs
      - name: Commit generated outputs only
        run: |
          git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'Synchronize catalog and runtime revision after partner lineage fix'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
