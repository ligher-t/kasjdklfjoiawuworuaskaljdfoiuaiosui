name: Temporary Zelgrad employment and exclusion status verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-zelgrad-exclusion-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify affected runtime
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v87_exclusion_organizer_infected.js
          node tools/check-efficient.cjs run v87_ursus_zelgrad_displaced_work.js
          node tools/check-efficient.cjs run v88_affiliation_goal_closure.test.cjs
          node tools/check-efficient.cjs run v88_rhine_and_rhodes_departure_lifecycle.test.cjs
      - name: Sync runtime generated files
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: synchronize reviewed event catalog and runtime revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
