name: Temporary BSW secondment boundaries
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: [.github/workflows/temporary-bsw-secondment.yml]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-event-scope-and-delivery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile event catalog and syntax
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/check-efficient.cjs syntax
          node tools/generate-event-catalog.cjs --check
      - name: Validate BSW enlistment, promotion and Rhodes landship assignment
        run: node tools/check-efficient.cjs run v88_cross_faction_affiliation_transitions.test.cjs v87_affiliation_career_paths.js v87_rhodes_landship_reforms.test.cjs
      - name: Sync verified generated artifacts
        run: |
          git add js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync Blacksteel secondment catalog and runtime revision"
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
