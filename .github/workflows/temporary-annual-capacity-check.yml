name: Temporary annual capacity and final-year coverage verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-annual-capacity-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check event scheduling and mixed deadline capacity
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_annual_deadline_capacity.test.cjs
          node tools/check-efficient.cjs run v88_deadline_coverage_metrics.test.cjs
          node tools/check-efficient.cjs run v88_age_cutoff_competing_followups.test.cjs
          node tools/check-efficient.cjs run v88_expiring_followup_priority.test.cjs
          node tools/check-efficient.cjs run v88_crisis_event_priority.test.cjs
          node tools/check-efficient.cjs run audit-diagnostics.test.cjs
      - name: Synchronize catalog and revision
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync urgent capacity scheduling and catalog revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
