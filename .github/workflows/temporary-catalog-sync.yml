name: Temporary comprehensive catalog repair verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-catalog-sync.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual catalog diagnostics and historical contracts
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run audit-diagnostics.test.cjs
          node tools/check-efficient.cjs run v88_historical_catalog_schema_and_sources.test.cjs
          node tools/check-efficient.cjs run v88_timeline_local_events.test.cjs
          node tools/check-efficient.cjs run v87_siracusa_family_lifecourse.js
      - name: Synchronize generated catalog and version
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync repaired catalog and runtime revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
