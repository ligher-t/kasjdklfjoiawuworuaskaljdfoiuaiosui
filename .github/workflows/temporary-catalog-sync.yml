name: Temporary student and family state synchronization
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-catalog-sync.yml']
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'ligher-t/kasjdklfjoiawuworuaskaljdfoiuaiosui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate catalog and run focused status tests
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_student_familia_status_debt.test.cjs
          node tools/check-efficient.cjs run v87_siracusa_family_lifecourse.js
          node tools/check-efficient.cjs run v87_ursus_student_reentry.js
      - name: Commit generated files only
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync event catalog and version for family and student status'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
