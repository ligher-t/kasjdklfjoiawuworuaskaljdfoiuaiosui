name: Temporary child future and memory verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-catalog-sync.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify sibling future, gifts and bereavement
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_family_child_future_and_memories.test.cjs
          node tools/check-efficient.cjs run v88_adult_child_contact_target_and_funds.test.cjs
          node tools/check-efficient.cjs run v88_multi_child_annual_family_budget_reconciliation.test.cjs
          node tools/check-efficient.cjs run v88_multi_child_diagnosis_target.test.cjs
      - name: Synchronize generated artifacts
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: sync child future catalog and runtime revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
