name: Temporary annual family remittance reconciliation
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-catalog-sync.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'ligher-t/kasjdklfjoiawuworuaskaljdfoiuaiosui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck annual receipts with medical travel surcharge
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_separate_spouse_sibling_annual_reconciliation.test.cjs
          node tools/check-efficient.cjs run v88_spouse_sibling_medical_funds.test.cjs
          node tools/check-efficient.cjs run v87_spouse_infection_care_chain.js
      - name: Commit generated assets
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: synchronize remittance catalog and runtime revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
