name: Education derived artifacts (one-time)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/education-catalog-generation.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical revision and event catalog generation
        run: |
          node tools/update-version.cjs
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/check-efficient.cjs syntax
      - name: Commit derived artifacts to the existing PR branch
        run: |
          if ! git diff --quiet -- js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/version.js EVENT_CATALOG.md tools/event-catalog-metadata.json
            git commit -m "chore(education): sync generated runtime and catalog"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
