name: Education event catalog generation (one-time)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/education-catalog-generation.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile event annotations and render generated event catalog
        run: |
          node tools/generate-event-catalog.cjs --reconcile
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
      - name: Commit regenerated artifacts to the current Draft PR
        run: |
          if ! git diff --quiet -- EVENT_CATALOG.md tools/event-catalog-metadata.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add EVENT_CATALOG.md tools/event-catalog-metadata.json
            git commit -m "chore(education): generate current education event catalog"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
