name: Temporary Reunion goal and deadline audit verification
on:
  push:
    branches: [fix/historical-event-scope-and-delivery]
    paths: ['.github/workflows/temporary-reunion-deadline-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify runtime with state audits
        run: |
          node tools/generate-event-catalog.cjs --write
          node tools/generate-event-catalog.cjs --check
          node tools/update-version.cjs
          node tools/check-efficient.cjs syntax
          node tools/check-efficient.cjs run v88_long_life_state_reproductions.test.cjs
          node tools/check-efficient.cjs run v88_deadline_coverage_metrics.test.cjs
          node tools/check-efficient.cjs run v88_reunion_goal_transition.test.cjs
          node tools/check-efficient.cjs run v88_cohabitation_residence_accounting.test.cjs
          node tools/check-efficient.cjs run audit-diagnostics.test.cjs
      - name: Commit generated files
        run: |
          git add EVENT_CATALOG.md js/version.js
          if ! git diff --cached --quiet; then
            git -c user.name='Codex Setup' -c user.email='codex-setup@localhost' commit -m 'chore: synchronize event catalog and engine revision'
            git push origin HEAD:fix/historical-event-scope-and-delivery
          fi
