<!doctype html><meta charset="utf-8"><title>Developer tools acceptance</title><h2 id="result">受入実行中</h2><pre id="checks"></pre><iframe id="game" src="../../index.html" style="width:100%;height:650px"></iframe><script>
game.onload=async()=>{const w=game.contentWindow, lines=[];const check=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);checks.textContent=lines.join('\n');};try{
const n=w.eval('REG.length'),progress=[];
const report=await w.runDevSimulation({count:n,maxYears:1,regionSampling:'balanced'},{onProgress:p=>progress.push(p)});
check(report.lifePaths.residences.filter(r=>r.phase==='birth').every(r=>r.total===1),'実エンジン: 地域別同数・出生居住集計');
check(progress.every(p=>p.completed+p.failed<=p.attempted),'進捗の完了・失敗・処理中');
const canceled=await w.runDevSimulation({count:10,maxYears:2},{shouldCancel:()=>true});check(canceled.summary.canceled&&canceled.summary.sampled===0,'中止と状態復元');
const changed=JSON.parse(JSON.stringify(report));changed.eventCoverage.shift();changed.eventCoverage.push({eventId:'acceptance-added',fired:0,candidateSlots:0});changed.choiceBranches[0].outcomes[0].probability+=1;
w.devRenderComparison(changed,report);check(changed.comparison.eventChanges.some(r=>r.status==='removed')&&changed.comparison.eventChanges.some(r=>r.status==='added')&&changed.comparison.branchChanges.length,'模擬レポート: 追加・削除・確率変更');
changed.catalogFindings=[];changed.failures=[10,20].map(seed=>({type:'runtime',error:'受入用の模擬失敗',count:1,example:{seed,birthYear:1077,birth:{region:'サーミ'}}}));
w.eval('DEV_LAST_SIMULATION_REPORT=null');w.renderDevSimulationDetails(changed);
check(w.document.getElementById('dev-failure-select').options.length===2,'模擬失敗の選択一覧');
w.document.getElementById('dev-failure-select').value='1';w.acceptanceReport=changed;w.eval('DEV_LAST_SIMULATION_REPORT=acceptanceReport;globalThis.acceptanceOldDev=dev;dev=async options=>options');const replay=await w.devReplayFirstFailure();w.eval('dev=acceptanceOldDev');
check(replay.replaySeed===20&&replay.regionSampling==='natural'&&replay.region==='サーミ','選択した失敗のseed・出生地域で単独再実行');
check(w.document.getElementById('dev-cohort-report').textContent.includes('地域別同数'),'集計の画面出力');
w.document.getElementById('developer-tools').open=true;w.document.getElementById('dev-cohort-report').parentElement.open=true;
result.textContent='受入 PASS（実処理と模擬レポートを区別）';
}catch(e){result.textContent='FAIL '+e.message;checks.textContent+=e.stack;}};
</script>
